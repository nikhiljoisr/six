[package]
name = "six"
version = "1.6.1"
description = "Six — a personal Ivy Lee Method app"
authors = ["Nikhil Jois"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "six_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Native notifications (scheduling, actions). notify-rust is disabled so macOS uses the
# UserNotifications framework; that path needs a .app bundle, so the plugin is only
# registered when the app runs from one (see lib.rs).
tauri-plugin-notifications = { version = "0.4", default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
time = "0.3"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"

# The window's own behaviours that Tauri does not expose (the green button zooms, it does
# not enter full screen). Already in the tree through tao; named here to be called.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
