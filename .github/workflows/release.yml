# Builds Six.app on a macOS runner and attaches it to a GitHub Release.
# Runs on a version tag (v1.2.0) or by hand from the Actions tab. A tag must match the
# version in src-tauri/tauri.conf.json, and nothing is built until the Rust tests and the
# type-check pass.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: The tag names the version in tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} but src-tauri/tauri.conf.json says $v" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Type-check the frontend
        run: pnpm typecheck

      - name: Build (universal) and sign
        run: pnpm build:mac:universal

      - name: Both architectures, and the signature holds
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Six.app
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          archs="$(lipo -archs "$bin")"
          echo "$bin: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "not universal" >&2; exit 1;; esac
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Zip the app
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent Six.app Six.app.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Six.app.zip \
            --title "Six ${GITHUB_REF_NAME}" \
            --notes "Six.app, universal (Apple Silicon and Intel), macOS 13+. Signed locally, not notarised: the first time, open System Settings → Privacy & Security and click Open Anyway, or run xattr -cr /Applications/Six.app. See the README." \
            || gh release upload "${GITHUB_REF_NAME}" src-tauri/target/universal-apple-darwin/release/bundle/macos/Six.app.zip --clobber

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Six.app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/Six.app.zip
